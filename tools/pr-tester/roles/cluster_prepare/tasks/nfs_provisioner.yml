---
# Deploy JooHo's NFS Provisioner Operator
# https://github.com/Jooho/nfs-provisioner-operator
#
# Applies all resources directly — no Go, kustomize, or make required.
# Creates an NFS server pod and a dynamic "nfs" StorageClass (ReadWriteMany).

- name: Check if NFS StorageClass already exists
  ansible.builtin.command: kubectl get storageclass nfs
  changed_when: false
  failed_when: false
  register: _nfs_sc_check

- name: Deploy NFS Provisioner Operator
  when: _nfs_sc_check.rc != 0
  vars:
    _nfs_ns: nfs-provisioner-operator-system
    _nfs_image: "{{ nfs_provisioner_image | default('quay.io/jooholee/nfs-provisioner-operator:0.0.9') }}"
  block:
    - name: Install NFS Provisioner CRD from upstream
      ansible.builtin.command:
        cmd: >-
          kubectl apply -f
          https://raw.githubusercontent.com/Jooho/nfs-provisioner-operator/main/config/crd/bases/cache.jhouse.com_nfsprovisioners.yaml

    - name: Create operator namespace
      ansible.builtin.command: "kubectl create namespace {{ _nfs_ns }}"
      register: _ns_create
      failed_when: _ns_create.rc != 0 and 'AlreadyExists' not in _ns_create.stderr
      changed_when: _ns_create.rc == 0

    - name: Apply operator RBAC and Deployment
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: nfs-provisioner-manager-role
          rules:
          - apiGroups: [""]
            resources: [endpoints, events, persistentvolumeclaims, persistentvolumes, serviceaccounts, services]
            verbs: [create, delete, get, list, patch, update, watch]
          - apiGroups: [""]
            resources: [pods]
            verbs: [get, list, watch]
          - apiGroups: [apiextensions.k8s.io]
            resources: [customresourcedefinitions]
            verbs: [get, list, watch]
          - apiGroups: [apps]
            resources: [deployments, deployments/finalizers]
            verbs: [create, delete, get, list, patch, update, watch]
          - apiGroups: [cache.jhouse.com]
            resources: [nfsprovisioners, nfsprovisioners/finalizers, nfsprovisioners/status]
            verbs: [create, delete, get, list, patch, update, watch]
          - apiGroups: [rbac.authorization.k8s.io]
            resources: [clusterrolebindings, clusterroles, rolebindings, roles]
            verbs: [create, delete, get, list, patch, update, watch]
          - apiGroups: [security.openshift.io]
            resources: [securitycontextconstraints]
            verbs: [create, delete, get, list, patch, update, watch]
          - apiGroups: [storage.k8s.io]
            resources: [storageclasses]
            verbs: [create, delete, get, list, patch, update, watch]
          - apiGroups: [policy]
            resources: [podsecuritypolicies]
            verbs: [use]
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: nfs-provisioner-manager-rolebinding
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: nfs-provisioner-manager-role
          subjects:
          - kind: ServiceAccount
            name: default
            namespace: {{ _nfs_ns }}
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: nfs-provisioner-leader-election-role
            namespace: {{ _nfs_ns }}
          rules:
          - apiGroups: [""]
            resources: [configmaps]
            verbs: [get, list, watch, create, update, patch, delete]
          - apiGroups: [coordination.k8s.io]
            resources: [leases]
            verbs: [get, list, watch, create, update, patch, delete]
          - apiGroups: [""]
            resources: [events]
            verbs: [create, patch]
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: nfs-provisioner-leader-election-rolebinding
            namespace: {{ _nfs_ns }}
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: nfs-provisioner-leader-election-role
          subjects:
          - kind: ServiceAccount
            name: default
            namespace: {{ _nfs_ns }}
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: nfs-provisioner-controller-manager
            namespace: {{ _nfs_ns }}
            labels:
              control-plane: controller-manager
          spec:
            replicas: 1
            selector:
              matchLabels:
                control-plane: controller-manager
            template:
              metadata:
                labels:
                  control-plane: controller-manager
              spec:
                containers:
                - name: manager
                  image: {{ _nfs_image }}
                  command: ["/manager"]
                  args: ["--enable-leader-election"]
                  resources:
                    limits:
                      cpu: 100m
                      memory: 500Mi
                    requests:
                      cpu: 100m
                      memory: 100Mi
                terminationGracePeriodSeconds: 10

    - name: Wait for NFS operator pod to be ready
      ansible.builtin.command: >-
        kubectl wait --for=condition=ready pod
        -l control-plane=controller-manager
        -n {{ _nfs_ns }}
        --timeout=120s
      changed_when: false
      retries: 3
      delay: 10
      register: _nfs_pod_wait
      until: _nfs_pod_wait.rc == 0

    - name: Create NFSProvisioner CR
      ansible.builtin.command:
        cmd: kubectl apply -f -
        stdin: |
          apiVersion: cache.jhouse.com/v1alpha1
          kind: NFSProvisioner
          metadata:
            name: nfs-server
            namespace: {{ _nfs_ns }}
          spec:
            storageSize: "{{ nfs_storage_size | default('10Gi') }}"

    - name: Wait for NFS StorageClass to be created
      ansible.builtin.command: kubectl get storageclass nfs
      changed_when: false
      register: _nfs_sc_wait
      retries: 12
      delay: 10
      until: _nfs_sc_wait.rc == 0

- name: Display NFS StorageClass
  ansible.builtin.command: kubectl get storageclass nfs
  changed_when: false
  register: _nfs_sc_info

- name: NFS Provisioner ready
  ansible.builtin.debug:
    msg: |
      NFS Provisioner Operator deployed.
      {{ _nfs_sc_info.stdout }}
      Use storageClassName: nfs for RWX PVCs.
