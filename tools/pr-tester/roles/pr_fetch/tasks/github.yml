---
- name: Validate pr_url is provided
  ansible.builtin.assert:
    that:
      - pr_url is defined
      - pr_url | length > 0
    fail_msg: "pr_url is required. Pass it with -e pr_url=https://github.com/owner/repo/pull/NUMBER"

- name: Parse PR URL
  ansible.builtin.set_fact:
    _pr_match: "{{ pr_url | regex_search('https://github\\.com/([^/]+)/([^/]+)/pull/([0-9]+)', '\\1', '\\2', '\\3') }}"

- name: Validate parsed PR URL
  ansible.builtin.assert:
    that:
      - _pr_match | length == 3
    fail_msg: "Invalid PR URL format: {{ pr_url }}. Expected https://github.com/OWNER/REPO/pull/NUMBER"

- name: Set PR metadata facts
  ansible.builtin.set_fact:
    pr_owner: "{{ _pr_match[0] }}"
    pr_repo: "{{ _pr_match[1] }}"
    pr_number: "{{ _pr_match[2] }}"
    pr_timestamp: "{{ ansible_facts['date_time']['epoch'] }}"

- name: Set sandbox path
  ansible.builtin.set_fact:
    sandbox_dir: "{{ sandbox_base }}/pr-{{ pr_number }}-{{ pr_timestamp }}"
    pr_image_tag: "{{ image_tag_prefix }}-{{ pr_number }}"

- name: Display PR info
  ansible.builtin.debug:
    msg: |
      PR #{{ pr_number }} from {{ pr_owner }}/{{ pr_repo }}
      Sandbox: {{ sandbox_dir }}
      Image tag: {{ pr_image_tag }}

- name: Ensure gh CLI is available
  ansible.builtin.command: gh --version
  changed_when: false

- name: Create sandbox directory
  ansible.builtin.file:
    path: "{{ sandbox_dir }}"
    state: directory
    mode: "0755"

- name: Get PR base branch
  ansible.builtin.command:
    cmd: gh pr view {{ pr_number }} --repo {{ pr_owner }}/{{ pr_repo }} --json baseRefName -q .baseRefName
  register: _pr_base_branch
  changed_when: false
  environment:
    GH_TOKEN: "{{ lookup('env', 'GH_TOKEN') | default(lookup('env', 'GITHUB_TOKEN'), true) }}"

- name: Set base branch and source directory facts
  ansible.builtin.set_fact:
    pr_base_branch: "{{ _pr_base_branch.stdout | trim }}"
    source_dir: "{{ sandbox_dir }}/{{ pr_repo }}"

# Only the current base branch and the PR head, each at depth 1. No history:
# the changed files and the diff come from the GitHub API below.
- name: Clone base branch into sandbox
  ansible.builtin.command:
    cmd: >-
      {{ role_path }}/../../scripts/live-run.sh --label "Cloning {{ pr_owner }}/{{ pr_repo }} {{ pr_base_branch }} (depth 1)" --
      git clone --progress --depth=1 --single-branch --branch {{ pr_base_branch }}
      https://github.com/{{ pr_owner }}/{{ pr_repo }}.git
      {{ source_dir }}
  args:
    creates: "{{ source_dir }}/.git"

# refs/pull/N/head lives on the base repository, for fork PRs too.
- name: Fetch and check out PR head
  ansible.builtin.command:
    argv:
      - "{{ role_path }}/../../scripts/live-run.sh"
      - --label
      - "Fetching PR #{{ pr_number }} head (depth 1)"
      - --
      - bash
      - -c
      - |
        set -e
        git fetch --progress --depth=1 origin +refs/pull/{{ pr_number }}/head:refs/remotes/origin/pull/{{ pr_number }}
        git checkout -B pr-{{ pr_number }} refs/remotes/origin/pull/{{ pr_number }}
        git log -1 --format='HEAD %h %s'
  args:
    chdir: "{{ source_dir }}"
  changed_when: true

- name: Record PR head commit
  ansible.builtin.command:
    cmd: git rev-parse HEAD
  args:
    chdir: "{{ source_dir }}"
  register: _pr_head
  changed_when: false

# pr_analyze and security_scan use these instead of a git diff, which would
# need the merge base and therefore history.
- name: Get PR changed files and diff from GitHub
  ansible.builtin.shell: |
    set -euo pipefail
    gh pr diff {{ pr_number }} --repo {{ pr_owner }}/{{ pr_repo }} --name-only > {{ sandbox_dir }}/changed-files.txt
    gh pr diff {{ pr_number }} --repo {{ pr_owner }}/{{ pr_repo }} > {{ sandbox_dir }}/change.diff
  args:
    executable: /bin/bash
  changed_when: false
  environment:
    GH_TOKEN: "{{ lookup('env', 'GH_TOKEN') | default(lookup('env', 'GITHUB_TOKEN'), true) }}"

- name: Set change facts
  ansible.builtin.set_fact:
    pr_head_sha: "{{ _pr_head.stdout | trim }}"
    pr_changed_files: "{{ lookup('file', sandbox_dir ~ '/changed-files.txt').splitlines() | select | list }}"
    pr_diff_file: "{{ sandbox_dir }}/change.diff"

- name: Trigger Copilot review (optional)
  ansible.builtin.command:
    cmd: >
      gh pr review {{ pr_number }}
      --comment -b "@copilot review this PR for security and correctness"
  args:
    chdir: "{{ source_dir }}"
  environment:
    GH_TOKEN: "{{ lookup('env', 'GH_TOKEN') | default(lookup('env', 'GITHUB_TOKEN'), true) }}"
  when: enable_copilot_review | bool

- name: PR fetch complete
  ansible.builtin.debug:
    msg: "PR #{{ pr_number }} checked out at {{ source_dir }} (base: {{ pr_base_branch }})"
