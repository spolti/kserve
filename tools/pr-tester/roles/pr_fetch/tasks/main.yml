---
# Detects where pr_url points and fetches it into a sandbox:
#   GitHub pull request:   https://github.com/OWNER/REPO/pull/NUMBER
#   GitLab merge request:  https://HOST/GROUP[/SUBGROUP...]/PROJECT/-/merge_requests/NUMBER
# Both paths set the same facts for the downstream roles:
#   pr_source, pr_owner, pr_repo, pr_number, pr_base_branch,
#   sandbox_dir, source_dir, pr_image_tag

- name: Validate pr_url is provided
  ansible.builtin.assert:
    that:
      - pr_url is defined
      - pr_url | length > 0
    fail_msg: >-
      pr_url is required. Pass it with -e pr_url=https://github.com/OWNER/REPO/pull/NUMBER
      or -e pr_url=https://HOST/GROUP/PROJECT/-/merge_requests/NUMBER

- name: Detect change request source
  ansible.builtin.set_fact:
    pr_source: >-
      {{ 'github' if pr_url is match('https://github\.com/[^/]+/[^/]+/pull/[0-9]+')
         else 'gitlab' if pr_url is match('https://[^/]+/.+/-/merge_requests/[0-9]+')
         else 'unknown' }}

- name: Fail on unsupported URL
  ansible.builtin.fail:
    msg: |
      Unsupported pr_url: {{ pr_url }}
      Expected one of:
        https://github.com/OWNER/REPO/pull/NUMBER
        https://HOST/GROUP/PROJECT/-/merge_requests/NUMBER
  when: pr_source == 'unknown'

- name: Display detected source
  ansible.builtin.debug:
    msg: "Detected {{ 'GitHub pull request' if pr_source == 'github' else 'GitLab merge request' }}: {{ pr_url }}"

- name: Fetch GitHub pull request
  ansible.builtin.include_tasks: github.yml
  when: pr_source == 'github'

- name: Fetch GitLab merge request
  ansible.builtin.include_role:
    name: gitlab_mr_fetch
  when: pr_source == 'gitlab'