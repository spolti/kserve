---
# Uses hack/kserve-install.sh with the detected --type flags.
# Supports deploying kserve, llmisvc, localmodel individually or combined.

- name: Set kserve-install.sh mode flag
  ansible.builtin.set_fact:
    _install_mode: "{{ '--raw' if deployment_mode == 'raw' else '--serverless' }}"

- name: Set install method
  ansible.builtin.set_fact:
    _install_method: "--kustomize"

- name: Build type flag
  ansible.builtin.set_fact:
    _type_flag: "--type {{ kserve_install_types | join(',') }}"

- name: Build kserve-install.sh command
  ansible.builtin.set_fact:
    _install_cmd: >-
      {{ source_dir }}/hack/kserve-install.sh
      {{ _type_flag }}
      {{ _install_mode }}
      {{ _install_method }}

- name: Display install command
  ansible.builtin.debug:
    msg: "Running: {{ _install_cmd }}"

- name: Run kserve-install.sh
  ansible.builtin.command: "{{ _install_cmd }}"
  args:
    chdir: "{{ source_dir }}"
  environment:
    KO_DOCKER_REPO: "{{ ko_docker_repo }}"
    TAG: "{{ pr_image_tag }}"
    ENGINE: "{{ engine }}"
    SET_KSERVE_VERSION: "{{ pr_image_tag }}"
    USE_LOCAL_CHARTS: "true"
  timeout: "{{ deploy_timeout }}"

- name: Patch controller deployments to use PR-built images
  vars:
    _img_prefix: "{{ (ko_docker_repo ~ '/') if cluster_type in ['crc', 'openshift'] else 'localhost/' if cluster_type == 'minikube' else '' }}"
    _pull_policy: "{{ 'Always' if cluster_type in ['crc', 'openshift'] else 'IfNotPresent' }}"
  block:
    - name: Patch KServe controller image and pull policy
      ansible.builtin.shell: |
        kubectl patch deployment kserve-controller-manager -n {{ kserve_namespace }} \
          --type=json -p='[
            {"op": "replace", "path": "/spec/template/spec/containers/0/image", "value": "{{ _img_prefix }}kserve-controller:{{ pr_image_tag }}"},
            {"op": "replace", "path": "/spec/template/spec/containers/0/imagePullPolicy", "value": "{{ _pull_policy }}"}
          ]'
      when: "'kserve' in kserve_install_types"

    # The controller does not read image env vars. Sidecar and init container
    # images come from inferenceservice-config, and for URIs matched by a
    # ClusterStorageContainer (gs://, s3://, http(s)://, ...) from that CR.
    - name: Patch sidecar and storage-initializer images
      when: "'kserve' in kserve_install_types"
      vars:
        _sidecar_images:
          - { key: agent, build: agent, image: agent }
          - { key: router, build: router, image: router }
          - { key: storageInitializer, build: storage-initializer, image: storage-initializer }
      block:
        - name: Read inferenceservice-config
          ansible.builtin.command: >-
            kubectl get configmap inferenceservice-config
            -n {{ kserve_namespace }} -o json
          changed_when: false
          register: _isvc_cm

        - name: Compute inferenceservice-config image overrides
          ansible.builtin.set_fact:
            _sidecar_patch: >-
              {{ _sidecar_patch | default({}) | combine({
                   item.key: (((_isvc_cm.stdout | from_json).data[item.key] | from_json)
                              | combine({'image': _img_prefix ~ item.image ~ ':' ~ pr_image_tag})) | to_json
                 }) }}
          loop: "{{ _sidecar_images }}"
          loop_control:
            label: "{{ item.key }}"
          when:
            - item.build in images_to_build
            - item.key in (_isvc_cm.stdout | from_json).data

        - name: Patch inferenceservice-config with PR-built images
          ansible.builtin.command:
            argv:
              - kubectl
              - patch
              - configmap
              - inferenceservice-config
              - -n
              - "{{ kserve_namespace }}"
              - --type=merge
              - -p
              - "{{ {'data': _sidecar_patch} | to_json }}"
          changed_when: true
          when: _sidecar_patch | default({}) | length > 0

        - name: Check default ClusterStorageContainer
          ansible.builtin.command: kubectl get clusterstoragecontainer default -o name
          changed_when: false
          failed_when: false
          register: _default_csc
          when: "'storage-initializer' in images_to_build"

        - name: Patch default ClusterStorageContainer with PR-built storage-initializer
          ansible.builtin.command:
            argv:
              - kubectl
              - patch
              - clusterstoragecontainer
              - default
              - --type=json
              - -p
              - >-
                {{ [{'op': 'replace', 'path': '/spec/container/image',
                     'value': _img_prefix ~ 'storage-initializer:' ~ pr_image_tag},
                    {'op': 'replace', 'path': '/spec/container/imagePullPolicy',
                     'value': _pull_policy}] | to_json }}
          changed_when: true
          when:
            - "'storage-initializer' in images_to_build"
            - _default_csc.rc == 0

        - name: Show effective sidecar and storage-initializer images
          ansible.builtin.shell: |
            set -o pipefail
            echo "inferenceservice-config:"
            kubectl get configmap inferenceservice-config -n {{ kserve_namespace }} -o json \
              | python3 -I -c 'import json,sys; d=json.load(sys.stdin)["data"]; [print(f"  {k}: {json.loads(d[k]).get(\"image\")}") for k in ("agent","router","storageInitializer") if k in d]'
            echo "clusterstoragecontainer/default:"
            kubectl get clusterstoragecontainer default -o jsonpath='  {.spec.container.image}{"\n"}' 2>/dev/null || echo "  (not present)"
          args:
            executable: /bin/bash
          changed_when: false
          register: _effective_images

        - name: Display effective images
          ansible.builtin.debug:
            msg: "{{ _effective_images.stdout }}"

    - name: Patch LLMISvc controller image and pull policy
      ansible.builtin.shell: |
        kubectl patch deployment llmisvc-controller-manager -n {{ kserve_namespace }} \
          --type=json -p='[
            {"op": "replace", "path": "/spec/template/spec/containers/0/image", "value": "{{ _img_prefix }}llmisvc-controller:{{ pr_image_tag }}"},
            {"op": "replace", "path": "/spec/template/spec/containers/0/imagePullPolicy", "value": "{{ _pull_policy }}"}
          ]'
      when: "'llmisvc' in kserve_install_types"

    - name: Patch LocalModel controller image and pull policy
      ansible.builtin.shell: |
        kubectl patch deployment kserve-localmodel-controller-manager -n {{ kserve_namespace }} \
          --type=json -p='[
            {"op": "replace", "path": "/spec/template/spec/containers/0/image", "value": "{{ _img_prefix }}kserve-localmodel-controller:{{ pr_image_tag }}"},
            {"op": "replace", "path": "/spec/template/spec/containers/0/imagePullPolicy", "value": "{{ _pull_policy }}"}
          ]'
      when: "'localmodel' in kserve_install_types"

    - name: Wait for patched controller rollout
      ansible.builtin.command: >-
        kubectl rollout status deployment/kserve-controller-manager
        -n {{ kserve_namespace }}
        --timeout=120s
      changed_when: false
      when: "'kserve' in kserve_install_types"

    - name: Verify controller image and pull policy
      ansible.builtin.shell: |
        kubectl get deployment kserve-controller-manager -n {{ kserve_namespace }} \
          -o jsonpath='image={.spec.template.spec.containers[0].image} pullPolicy={.spec.template.spec.containers[0].imagePullPolicy}'
      changed_when: false
      register: _patched_image
      when: "'kserve' in kserve_install_types"

    - name: Display patched image
      ansible.builtin.debug:
        msg: "Controller patched: {{ _patched_image.stdout }}"
      when: _patched_image is defined and _patched_image.stdout is defined

- name: KServe deployed via install script
  ansible.builtin.debug:
    msg: "Deployed types [{{ kserve_install_types | join(', ') }}] with {{ _install_mode }} {{ _install_method }}"
