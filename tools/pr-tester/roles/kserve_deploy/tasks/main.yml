---
- name: Validate prerequisites
  ansible.builtin.assert:
    that:
      - source_dir is defined
      - ko_docker_repo is defined
      - pr_image_tag is defined
    fail_msg: "source_dir, ko_docker_repo, and pr_image_tag must be set by previous roles"

- name: Default kserve_install_types if not set
  ansible.builtin.set_fact:
    kserve_install_types: "{{ kserve_install_types | default(['kserve']) }}"

- name: Display install plan
  ansible.builtin.debug:
    msg: |
      Deploy plan:
        Install types: {{ kserve_install_types | join(', ') }}
        Cluster: {{ cluster_type }}
        Mode: {{ deployment_mode }}
        Registry: {{ ko_docker_repo }}
        Tag: {{ pr_image_tag }}

# A partial uninstall can leave KServe webhook configurations pointing at a
# service in a namespace that no longer exists. The API server then rejects
# every object those webhooks cover, so the reinstall fails. They are broken
# anyway and the install recreates them.
- name: Find stale KServe webhook configurations
  ansible.builtin.shell: |
    set -o pipefail
    existing=$(kubectl get namespaces -o jsonpath='{.items[*].metadata.name}')
    kubectl get mutatingwebhookconfigurations,validatingwebhookconfigurations -o json \
      | python3 -I -c '
    import json, sys
    namespaces = set(sys.argv[1].split())
    for item in json.load(sys.stdin)["items"]:
        name = item["metadata"]["name"]
        if "kserve" not in name:
            continue
        targets = {w.get("clientConfig", {}).get("service", {}).get("namespace")
                   for w in item.get("webhooks") or []}
        if any(t and t not in namespaces for t in targets):
            kind = "mutatingwebhookconfiguration" if item["kind"].startswith("Mutating") \
                   else "validatingwebhookconfiguration"
            print(f"{kind}/{name}")
    ' "$existing"
  args:
    executable: /bin/bash
  changed_when: false
  register: _stale_webhooks

- name: Remove stale KServe webhook configurations
  ansible.builtin.command:
    argv: >-
      {{ [role_path ~ '/../../scripts/live-run.sh', '--label',
          'Removing ' ~ (_stale_webhooks.stdout_lines | length) ~ ' stale KServe webhook configuration(s) whose service namespace no longer exists',
          '--', 'kubectl', 'delete', '--ignore-not-found'] + _stale_webhooks.stdout_lines }}
  changed_when: true
  when: _stale_webhooks.stdout_lines | length > 0

- name: Determine deploy strategy
  ansible.builtin.set_fact:
    _use_make_deploy_dev: "{{ cluster_type == 'kind' and kserve_install_types | sort == ['kserve', 'llmisvc', 'localmodel'] | sort }}"

- name: Deploy via make deploy-dev (Kind, all components)
  ansible.builtin.include_tasks: deploy_dev.yml
  when: _use_make_deploy_dev | bool

- name: Deploy via kserve-install.sh (selective components)
  ansible.builtin.include_tasks: deploy_install_script.yml
  when: not (_use_make_deploy_dev | bool)

- name: Wait for KServe controller rollout
  ansible.builtin.command: >-
    {{ role_path }}/../../scripts/live-run.sh --label "Rolling out kserve-controller-manager" --
    kubectl rollout status deployment/kserve-controller-manager
    -n {{ kserve_namespace }}
    --timeout={{ deploy_timeout }}s
  changed_when: false
  when: "'kserve' in kserve_install_types"

- name: Wait for LocalModel controller rollout (if deployed)
  ansible.builtin.command: >-
    {{ role_path }}/../../scripts/live-run.sh --label "Rolling out kserve-localmodel-controller-manager" --
    kubectl rollout status deployment/kserve-localmodel-controller-manager
    -n {{ kserve_namespace }}
    --timeout={{ deploy_timeout }}s
  changed_when: false
  failed_when: false
  when: "'localmodel' in kserve_install_types"

- name: Wait for LLMISvc controller rollout (if deployed)
  ansible.builtin.command: >-
    {{ role_path }}/../../scripts/live-run.sh --label "Rolling out llmisvc-controller-manager" --
    kubectl rollout status deployment/llmisvc-controller-manager
    -n {{ kserve_namespace }}
    --timeout={{ deploy_timeout }}s
  changed_when: false
  when: "'llmisvc' in kserve_install_types"

- name: Wait for webhook to become reachable
  ansible.builtin.shell: |
    kubectl get endpoints kserve-webhook-server-service -n {{ kserve_namespace }} \
      -o jsonpath='{.subsets[0].addresses[0].ip}' 2>/dev/null
  args:
    executable: /bin/bash
  changed_when: false
  register: _webhook_ep
  retries: 30
  delay: 5
  until: _webhook_ep.stdout | length > 0
  when: "'kserve' in kserve_install_types"

- name: Verify webhook is responding
  ansible.builtin.shell: |
    kubectl get inferenceservice -n {{ kserve_namespace }} 2>&1 || true
  changed_when: false
  failed_when: false
  when: "'kserve' in kserve_install_types"

- name: Display KServe pods
  ansible.builtin.command: kubectl get pods -n {{ kserve_namespace }}
  changed_when: false
  register: _kserve_pods

- name: Show KServe deployment status
  ansible.builtin.debug:
    msg: "{{ _kserve_pods.stdout }}"
