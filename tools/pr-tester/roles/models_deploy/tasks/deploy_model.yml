---
- name: "Set model spec for {{ model_key }}"
  ansible.builtin.set_fact:
    _model: "{{ _model_definitions[model_key] }}"

- name: "Select template for {{ _model.name }}"
  ansible.builtin.set_fact:
    _template_name: "{{ _model.template | default('llminferenceservice.yml.j2' if _model.kind == 'LLMInferenceService' else 'inferenceservice.yml.j2') }}"
    _wait_resource: "{{ 'llminferenceservice' if _model.kind == 'LLMInferenceService' else 'inferenceservice' }}"

- name: "Apply {{ _model.kind }} {{ _model.name }}"
  ansible.builtin.command:
    cmd: kubectl apply -f -
    stdin: "{{ lookup('template', _template_name) }}"
  vars:
    model: "{{ _model }}"

# Streams conditions, pod/container states, events and container logs while
# waiting (scripts/watch-workload.sh). The timeout keeps the previous total
# budget (3 attempts of isvc_ready_timeout).
- name: "Wait for {{ _model.name }} to be ready"
  ansible.builtin.command:
    argv:
      - "{{ role_path }}/../../scripts/watch-workload.sh"
      - --kind
      - "{{ _wait_resource }}"
      - --name
      - "{{ _model.name }}"
      - --namespace
      - "{{ test_namespace }}"
      - --timeout
      - "{{ (isvc_ready_timeout | int * 3) | string }}"
  changed_when: false
  register: _isvc_wait

# Multi-model InferenceServices: deploy their TrainedModels once the
# predictor (and its agent puller) is up.
- name: "Deploy TrainedModels for {{ _model.name }}"
  ansible.builtin.include_tasks: deploy_trained_model.yml
  loop: "{{ _model.trained_models | default([]) }}"
  loop_control:
    loop_var: _tm_item
    label: "{{ _tm_item.name }}"
  vars:
    trained_model: "{{ {'isvc': _model.name} | combine(_tm_item) }}"
