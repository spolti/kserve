---
# Matches both GitHub PR builds (pr-N) and GitLab MR builds (mr-N).
- name: Set image tags for cleanup
  ansible.builtin.set_fact:
    _cleanup_tag_regex: ":({{ image_tag_prefix }}|{{ mr_image_tag_prefix | default('mr') }})-{{ _cleanup_pr }}$"

- name: Find images with PR or MR tag
  ansible.builtin.shell: |
    {{ engine }} images --format '{%raw%}{{.Repository}}:{{.Tag}}{%endraw%}' | grep -E '{{ _cleanup_tag_regex }}' || true
  changed_when: false
  register: _pr_images

- name: Remove PR-tagged images
  ansible.builtin.command: "{{ engine }} rmi {{ item }}"
  loop: "{{ _pr_images.stdout_lines }}"
  loop_control:
    label: "{{ item }}"
  when: _pr_images.stdout_lines | length > 0
  failed_when: false
  changed_when: true
